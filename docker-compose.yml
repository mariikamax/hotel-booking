
services:
  app:
    build: .
    container_name: hotel-booking-app
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hotel_booking
      DB_USERNAME: hotel_user
      DB_PASSWORD: hotel_password

  db:
    image: postgres:16
    container_name: hotel-booking-db
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
